<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website Watcher</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --text:#1d1d1f; --muted:#6b6b70; --line:#e2e2e0; --accent:#2f6fec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141416; --card:#1e1e21; --text:#ececef; --muted:#9a9aa2; --line:#2e2e33; --accent:#6d9bff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:620px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:28px; margin:0 0 4px; }
  p.lead { color:var(--muted); margin:0 0 28px; }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input { flex:1 1 260px; min-width:0; padding:12px 14px; font-size:16px; color:var(--text);
          background:var(--card); border:1px solid var(--line); border-radius:8px; }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  button { padding:12px 20px; font-size:16px; font-weight:600; color:#fff; background:var(--accent);
           border:0; border-radius:8px; cursor:pointer; }
  .note { color:var(--muted); font-size:14px; margin:10px 0 0; min-height:1.5em; }
  .error { color:#d33; }
  h2 { font-size:17px; margin:40px 0 10px; }
  ul { list-style:none; padding:0; margin:0; background:var(--card);
       border:1px solid var(--line); border-radius:8px; }
  li { padding:10px 14px; border-top:1px solid var(--line); overflow-wrap:anywhere; }
  li:first-child { border-top:0; }
  li a { color:var(--text); text-decoration:none; }
  li a:hover { text-decoration:underline; }
  li small { color:var(--muted); display:block; }
  .empty { color:var(--muted); }
  .ok { color:#1a7f37; }
  button:disabled { opacity:.6; cursor:wait; }
  li { display:flex; gap:12px; align-items:center; }
  li .info { flex:1; min-width:0; }
  li .remove { background:none; color:var(--muted); border:1px solid var(--line);
               padding:6px 10px; font-size:13px; font-weight:500; }
  li .remove:hover { color:#d33; border-color:#d33; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:var(--muted); }
  .dot.ok { background:#1a7f37; } .dot.down { background:#d33; }
</style>
</head>
<body>
<main>
  <h1>Website Watcher</h1>
  <p class="lead">Submit a website link. It gets checked every few minutes, and an email goes out whenever the page changes.</p>

  <form id="form">
    <input id="url" type="text" inputmode="url" autocomplete="url" placeholder="https://example.com" required>
    <button type="submit">Watch</button>
  </form>
  <p class="note" id="note"></p>

  <h2>Watched websites (<span id="count">…</span>)</h2>
  <ul id="list"><li class="empty">Loading…</li></ul>
</main>
<script>
const note = document.getElementById("note");
const button = document.querySelector("#form button");
const input = document.getElementById("url");

function say(text, kind) {
  note.className = "note" + (kind ? " " + kind : "");
  note.textContent = text;
}

async function post(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Something went wrong. Please try again.");
  return data;
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  button.disabled = true;
  say("Checking the link…");
  try {
    const r = await post("api/add", { url: input.value });
    say(`Added ${r.title ? "“" + r.title + "” " : ""}(${r.url}). ` +
        (r.checking ? "The first check is running now." : "It will be checked within a few minutes."), "ok");
    input.value = "";
    loadSites();
  } catch (err) {
    say(err.message, "error");
  } finally {
    button.disabled = false;
  }
});

async function removeSite(url, btn) {
  let password = "";
  try { password = sessionStorage.getItem("ww-pass") || ""; } catch {}
  if (!password) password = prompt(`Password to stop watching ${url}:`) || "";
  if (!password) return;
  btn.disabled = true;
  try {
    await post("api/remove", { url, password });
    try { sessionStorage.setItem("ww-pass", password); } catch {}
    say(`Stopped watching ${url}.`, "ok");
    loadSites();
  } catch (err) {
    try { sessionStorage.removeItem("ww-pass"); } catch {}
    say(err.message, "error");
    btn.disabled = false;
  }
}

const STATE_TEXT = { ok: "Watching", down: "Not responding", pending: "Waiting for first check" };

async function loadSites() {
  const list = document.getElementById("list");
  let sites = null;
  try {
    const res = await fetch("api/sites", { cache: "no-store" });
    if (res.ok) sites = await res.json();
  } catch {}
  document.getElementById("count").textContent = sites ? sites.length : "?";
  list.replaceChildren();
  if (!sites || !sites.length) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = sites ? "Nothing yet. Add the first one above." : "Couldn't load the list.";
    list.append(li);
    return;
  }
  for (const s of sites.slice().reverse()) {
    const li = document.createElement("li");
    const info = document.createElement("div");
    info.className = "info";
    const a = document.createElement("a");
    a.href = s.url; a.textContent = s.url; a.rel = "noopener nofollow"; a.target = "_blank";
    const meta = document.createElement("small");
    const dot = document.createElement("span");
    dot.className = "dot " + s.state;
    meta.append(dot, `${STATE_TEXT[s.state] || ""} · added ${s.added || ""}` +
      (s.lastChange ? ` · last change ${s.lastChange}` : ""));
    info.append(a, meta);
    const btn = document.createElement("button");
    btn.className = "remove"; btn.type = "button"; btn.textContent = "Remove";
    btn.addEventListener("click", () => removeSite(s.url, btn));
    li.append(info, btn);
    list.append(li);
  }
}

loadSites();
</script>
</body>
</html>
